# grupo de servidores entre los que nginx reparte las peticiones.
# los nombres api1, api2, api3 son los nombres de los servicios en el compose
# (docker los resuelve por DNS dentro de la red del proyecto)
upstream flask_backend {
    server api1:5000;
    server api2:5000;
    server api3:5000;
}

server {
    listen 80;

    # todo lo que llegue a / se manda al upstream (round robin por defecto)
    location / {
        proxy_pass http://flask_backend;
    }
}
