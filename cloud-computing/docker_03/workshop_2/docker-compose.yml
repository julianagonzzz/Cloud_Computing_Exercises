# Parte 2/3 - reverse proxy con routing por ruta
# los servicios flask NO publican puertos, solo nginx (8080)
services:
  users:
    build: ./users

  products:
    build: ./products

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/routing.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - users
      - products
