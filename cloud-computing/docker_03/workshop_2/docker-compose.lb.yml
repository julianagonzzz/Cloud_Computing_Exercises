# Parte 5 - reverse proxy + load balancer
# uso: docker compose -f docker-compose.lb.yml up --build -d
services:
  # dos instancias de users construidas desde la misma carpeta
  users1:
    build: ./users

  users2:
    build: ./users

  products:
    build: ./products

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - users1
      - users2
      - products
