# Reto - /api/orders/ con dos instancias balanceadas
# uso: docker compose -f docker-compose.reto.yml up --build -d
services:
  users1:
    build: ./users

  users2:
    build: ./users

  products:
    build: ./products

  orders1:
    build: ./orders

  orders2:
    build: ./orders

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/reto.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - users1
      - users2
      - products
      - orders1
      - orders2
