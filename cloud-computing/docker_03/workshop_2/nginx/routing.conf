# Parte 3 - solo reverse proxy + routing
# cada ruta va a UN backend fijo, no hay reparto entre instancias
server {
    listen 80;

    # el "/" al final del proxy_pass hace que nginx quite el prefijo:
    # /api/users/ -> http://users:5000/
    location /api/users/ {
        proxy_pass http://users:5000/;
    }

    location /api/products/ {
        proxy_pass http://products:5000/;
    }
}
