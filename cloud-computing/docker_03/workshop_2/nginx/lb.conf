# Parte 5 - reverse proxy + load balancer
# ahora users tiene dos instancias y nginx las reparte con round robin
upstream users_backend {
    server users1:5000;
    server users2:5000;
}

server {
    listen 80;

    location /api/users/ {
        proxy_pass http://users_backend/;
    }

    # products sigue siendo una sola instancia (solo routing)
    location /api/products/ {
        proxy_pass http://products:5000/;
    }
}
