# Parte 4 - postgres con volumen y scripts de inicializacion
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: universidad
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      # volumen con nombre: los datos sobreviven a un "docker compose down"
      - postgres_data:/var/lib/postgresql/data
      # todo lo que este en esta carpeta se ejecuta al iniciar con la carpeta de datos vacia
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
