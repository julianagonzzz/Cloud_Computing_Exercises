# variables comunes de conexion a la base, para no repetirlas en cada api
# (los campos que empiezan por x- compose los ignora, solo sirven para reutilizar con &)
x-db-env: &db-env
  DB_HOST: db
  DB_NAME: shop
  DB_USER: postgres
  DB_PASSWORD: postgres

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      # el init.sql crea la tabla e inserta los productos al primer arranque
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # las apis esperan a que postgres de verdad acepte conexiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  api1:
    build: ./api
    environment:
      <<: *db-env
      INSTANCE: api-1
    depends_on:
      db:
        condition: service_healthy

  api2:
    build: ./api
    environment:
      <<: *db-env
      INSTANCE: api-2
    depends_on:
      db:
        condition: service_healthy

  api3:
    build: ./api
    environment:
      <<: *db-env
      INSTANCE: api-3
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  pg_data:
