# las tres apis detras de un mismo upstream (round robin)
upstream flask_backend {
    server api1:5000;
    server api2:5000;
    server api3:5000;
}

server {
    listen 80;

    location / {
        proxy_pass http://flask_backend;
        # para que flask sepa la ip real del cliente y no la de nginx
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
